name: Publish release

# Fills the Releases panel when a tag is pushed.
#
# Presentation only. CurseForge builds from the tag itself, via the packaging
# webhook, and never reads anything here -- so this failing costs a tidy-looking
# repository page and nothing else.
#
# It runs on a tag rather than creating one, which is the opposite of
# socialplus's workflow, and deliberately. There, the tag and the release are
# made together because nothing writes the notes before the tag exists, so
# CurseForge would build against the previous version's file.
#
# Here tools/Publish-Addon.ps1 writes CHANGELOG-RELEASE.md and commits it BEFORE
# it tags, so the tagged commit already carries the notes .pkgmeta points at.
# There is no window to lose and the tag can go up first.
#
# (An earlier version of this note said ArenaPlus had no manual-changelog at
# all. It has had one since .pkgmeta line 44 -- the reasoning above is what
# actually keeps the ordering safe, not the absence of the setting.)
#
# Tags are pushed by tools/Publish-Addon.ps1, from the dashboard's Publish
# button. Nothing here needs the GitHub CLI installed on the machine that does
# that -- gh and a token are already on the runner, which is the whole reason
# this is a workflow rather than another step in the script.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so the previous tag can be found.
          fetch-depth: 0

      - name: Build the notes from the commits since the previous tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          # The nearest tag before this one, walking back through history rather
          # than sorting names. Sorting is where this goes wrong: "1.10a" comes
          # before "1.9a" as text and after it as a version, and both shapes are
          # in use across these repositories.
          PREV="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"

          # CHANGELOG-RELEASE.md holds exactly this version's entry. It is
          # written by Publish-Addon.ps1 and committed with the tag, and it is
          # the same file .pkgmeta points CurseForge at -- so the project page
          # and the GitHub release say the same thing rather than two different
          # things assembled two different ways.
          #
          # Commit subjects were the first source here and were the wrong one:
          # they are written for whoever maintains this, not for a player.
          # "Keep ## Interface on the first line of the .toc" is true, and
          # useless as a release note.
          if [ -s CHANGELOG-RELEASE.md ]; then
            cp CHANGELOG-RELEASE.md notes.md
          elif [ -n "${PREV}" ]; then
            git log "${PREV}..${VERSION}" --format='- %s' > notes.md
          else
            echo "First release." > notes.md
          fi

          # echo rather than printf: this file has been through enough
          # backslash-mangling for one day, and a compare link needs none.
          if [ -n "${PREV}" ]; then
            {
              echo ""
              echo "Full changes: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${VERSION}"
            } >> notes.md
          fi

          # An empty body is rejected, and a tag on a commit already tagged
          # would produce one.
          [ -s notes.md ] || echo "No changes recorded." > notes.md

          echo "--- notes ---"
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          # Idempotent: a re-run, or a tag deleted and pushed again, should not
          # fail on a release that is already there.
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
          else
            gh release create "${VERSION}" --title "${VERSION}" --notes-file notes.md
          fi

      - name: Announce it in Discord
        # Optional, and silently skipped when no webhook is configured: the
        # release itself must never fail because an announcement could not be
        # sent. Add DISCORD_WEBHOOK under Settings -> Secrets and variables ->
        # Actions to turn it on.
        #
        # The secret is a Discord webhook URL, which is a password: anybody
        # holding it can post into that channel as the app. It lives in GitHub's
        # secret store and nowhere else -- never in the repository, never in a
        # log. Nothing below echoes it.
        #
        # Linked to the CurseForge PROJECT rather than to the new file, and that
        # is deliberate. CurseForge builds from the tag asynchronously, so at the
        # moment this runs the file usually does not exist yet -- a direct file
        # link would 404 for the first minute or two. The project page always
        # resolves and always shows the newest file.
        #
        # By id, not by slug: the id is in the .toc, so there is nothing here to
        # guess or to keep in step with a rename.
        #
        # jq builds the JSON. The notes contain quotes, apostrophes, em-dashes
        # and newlines -- every one of which breaks a hand-assembled payload --
        # and --rawfile hands the file to jq without the shell touching it.
        if: ${{ always() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "No DISCORD_WEBHOOK secret; nothing announced."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME}"
          PROJECT="https://www.curseforge.com/projects/1669655"

          # Discord caps an embed description at 4096 characters. Truncated on a
          # character count rather than a line count, because one long bullet is
          # as capable of overflowing it as thirty short ones.
          # The BOM goes first. CHANGELOG-RELEASE.md is written UTF-8 with one,
          # and left in place it becomes the first character of the embed --
          # invisible, but it is the sort of thing that shows up later as a
          # stray glyph in something that renders more strictly than Discord.
          sed -i '1s/^ï»¿//' notes.md

          head -c 3900 notes.md > body.md
          if [ "$(wc -c < notes.md)" -gt 3900 ]; then
            echo "" >> body.md
            echo "..." >> body.md
          fi

          jq -n \
            --arg title "ArenaPlus ${GITHUB_REF_NAME}" \
            --arg url "${PROJECT}" \
            --rawfile body body.md \
            '{embeds: [{title: $title, url: $url, description: $body, color: 3447003}]}' \
            > payload.json

          # --fail so a rejected post is a failed step rather than a silent one.
          # The webhook goes in as a variable and is never printed.
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "${DISCORD_WEBHOOK}"

          echo "Announced ${VERSION}."

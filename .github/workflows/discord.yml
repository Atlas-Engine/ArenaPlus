name: Discord Notifications

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  discord-release:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]

          release_name = os.environ["RELEASE_NAME"] or os.environ["RELEASE_TAG"]
          release_tag = os.environ["RELEASE_TAG"]
          release_url = os.environ["RELEASE_URL"]
          release_body = os.environ["RELEASE_BODY"] or "No changelog provided."
          repository = os.environ["REPOSITORY"]

          # Discord embeds have a 4096-character description limit.
          if len(release_body) > 4000:
              release_body = release_body[:3997] + "..."

          payload = {
              "username": "Atlas-Engine",
              "embeds": [
                  {
                      "title": f"🚀 {release_name}",
                      "url": release_url,
                      "description": release_body,
                      "fields": [
                          {
                              "name": "Version",
                              "value": f"`{release_tag}`",
                              "inline": True
                          },
                          {
                              "name": "Repository",
                              "value": f"`{repository}`",
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": "Atlas-Engine"
                      }
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Atlas-Engine-GitHub-Actions"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              if response.status < 200 or response.status >= 300:
                  raise RuntimeError(
                      f"Discord returned HTTP {response.status}"
                  )

          print("Discord notification sent successfully.")
          PY
